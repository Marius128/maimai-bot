spring:
  application:
    name: maimai-bot

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/maimai_bot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver


mybatis:
  configuration:
    map-underscore-to-camel-case: true

onebot:
  websocket-url: ${ONEBOT_WEBSOCKET_URL:ws://127.0.0.1:3001/}
  access-token: ${ONEBOT_ACCESS_TOKEN:}

maimai:
  adapter:
    base-url: ${MAIMAI_ADAPTER_BASE_URL:http://127.0.0.1:8082}
  provider:
    diving-fish:
      base-url: ${DIVING_FISH_BASE_URL:https://www.diving-fish.com/api/maimaidxprober}
      oauth:
        auth-url: ${DIVING_FISH_OAUTH_AUTH_URL:https://auth.diving-fish.com}
        client-id: ${DIVING_FISH_OAUTH_CLIENT_ID:}
        client-secret: ${DIVING_FISH_OAUTH_CLIENT_SECRET:}
    lxns:
      base-url: ${LXNS_BASE_URL:https://maimai.lxns.net/api/v0}
      api-key: ${LXNS_API_KEY:}
      oauth:
        client-id: ${LXNS_OAUTH_CLIENT_ID:}
        client-secret: ${LXNS_OAUTH_CLIENT_SECRET:}
        authorize-url: ${LXNS_OAUTH_AUTHORIZE_URL:https://maimai.lxns.net/oauth/authorize}
        token-url: ${LXNS_OAUTH_TOKEN_URL:https://maimai.lxns.net/api/v0/oauth/token}
        userinfo-url: ${LXNS_OAUTH_USERINFO_URL:https://maimai.lxns.net/api/v0/oauth/userinfo}
        redirect-uri: ${LXNS_OAUTH_REDIRECT_URI:urn:ietf:wg:oauth:2.0:oob}
        scopes: read_player write_player openid profile
  assets:
    root-directory: ${MAIMAI_ASSET_DIR:./data/maimai}
    catalog-refresh-hours: ${MAIMAI_CATALOG_REFRESH_HOURS:24}
    jacket-base-url: ${MAIMAI_JACKET_BASE_URL:https://www.diving-fish.com/covers}
    fallback-jacket-base-url: ${MAIMAI_FALLBACK_JACKET_BASE_URL:https://meta.salt.realtvop.top/covers}

security:
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
server:
  port: 8081
