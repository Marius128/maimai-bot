spring:
  application:
    name: maimai-bot

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/maimai_bot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

onebot:
  websocket-url: ${ONEBOT_WEBSOCKET_URL:ws://127.0.0.1:3001/}
  access-token: ${ONEBOT_ACCESS_TOKEN:}
